<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Olympiad Quiz Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --topic-color:#2E7D32;
    --topic-light:#C8E6C9;
    --ink:#22303A;
    --grey:#607D8B;
    --paper:#FBF6E8;
    --kraft:#F1E4C6;
    --kraft-dark:#E4D3A8;
    --green-ok:#2f6b52;
    --red-bad:#B84A3E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Quicksand', -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at top, #3d2f22 0%, #1c1710 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
    padding:1.2rem;
  }
  .display{font-family:'Baloo 2','Comic Sans MS','Segoe UI Rounded',sans-serif;}

  #app{
    width:min(1000px, 100%);
    min-height:min(700px, 90vh);
    background:var(--kraft);
    border-radius:24px;
    box-shadow:0 30px 60px rgba(0,0,0,.5), 0 0 0 10px #3d2f22, 0 0 0 12px #6b5236;
    overflow:hidden;
    display:flex; flex-direction:column;
    position:relative;
  }

  .screen{ display:none; flex-direction:column; flex:1; }
  .screen.active{ display:flex; }

  /* ---------- HEADER ---------- */
  #appHeader{
    background:linear-gradient(135deg,#2E7D32,#1B5E20);
    color:#fff; padding:1.4rem 1.6rem 1.2rem;
    text-align:center;
    transition:background .4s ease;
  }
  #appHeader h1{
    font-size:clamp(1.5rem,4vw,2.1rem); margin:0 0 .25rem;
    text-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  #appHeader p{ margin:0; font-size:.95rem; color:rgba(255,255,255,.9); }

  /* ---------- HOME / TOPIC SELECT ---------- */
  #homeScreen{ padding:1.4rem 1.6rem 1.8rem; overflow-y:auto; }
  .topic-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:.9rem; margin-top:1rem;
  }
  .topic-card{
    background:var(--paper); border-radius:16px; padding:1.1rem 1rem;
    cursor:pointer; text-align:left;
    border:3px solid var(--card-color, #ccc);
    box-shadow:0 4px 0 rgba(0,0,0,.12);
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:.35rem;
  }
  .topic-card:hover{ transform:translateY(-3px); box-shadow:0 7px 0 rgba(0,0,0,.14); }
  .topic-card .tc-top{ display:flex; align-items:center; gap:.6rem; }
  .topic-card .tc-emoji{ font-size:1.9rem; }
  .topic-card .tc-name{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.05rem; color:var(--card-color,#333); }
  .topic-card .tc-count{ font-size:.82rem; color:var(--grey); font-weight:700; }
  .topic-card .tc-best{ font-size:.78rem; color:var(--green-ok); font-weight:700; min-height:1.1em; }

  .mixed-card{
    grid-column:1/-1;
    background:linear-gradient(135deg,#E1665B,#D98E33);
    color:#fff; border:3px solid #fff;
  }
  .mixed-card .tc-name{ color:#fff; font-size:1.2rem; }
  .mixed-card .tc-count{ color:rgba(255,255,255,.9); }
  .mixed-card .tc-best{ color:#fff9; }

  /* ---------- QUIZ SCREEN ---------- */
  #quizScreen{ padding:1.2rem 1.6rem 1.6rem; }
  .quiz-topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:.6rem; flex-wrap:wrap; gap:.4rem;
  }
  #quizProgressLabel{ font-weight:800; font-family:'Baloo 2',sans-serif; color:var(--topic-color); font-size:.95rem; }
  #quizScoreLabel{ font-weight:800; font-family:'Baloo 2',sans-serif; color:var(--ink); font-size:.95rem; }
  #backHomeBtn{
    border:none; background:var(--paper); border-radius:999px; padding:.35rem .9rem;
    font-family:'Quicksand',sans-serif; font-weight:700; cursor:pointer; font-size:.82rem; color:var(--ink);
    box-shadow:0 2px 0 #d8c48f;
  }
  #progressTrack{ height:8px; background:#d8c48f; border-radius:5px; overflow:hidden; margin-bottom:1.1rem; }
  #progressFill{ height:100%; width:0%; background:linear-gradient(90deg,var(--topic-color),var(--topic-light)); border-radius:5px; transition:width .35s ease; }

  .q-card{
    background:var(--paper); border-radius:18px; padding:1.4rem 1.5rem;
    box-shadow:0 6px 0 rgba(0,0,0,.1);
    border:3px solid var(--topic-color);
    flex:1;
    display:flex; flex-direction:column;
  }
  .q-text{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(1.05rem,2.6vw,1.35rem);
    color:var(--ink); margin-bottom:1.2rem; line-height:1.35;
  }
  .q-opts{ display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  .q-opt{
    background:#fff; border:2.5px solid #d8c48f; border-radius:12px;
    padding:.85rem 1rem; font-family:'Quicksand',sans-serif; font-weight:700; font-size:.98rem;
    color:var(--ink); cursor:pointer; text-align:left; position:relative;
    transition:transform .12s ease, background .2s ease, border-color .2s ease;
    display:flex; align-items:center; gap:.5rem;
  }
  .q-opt .opt-letter{
    width:26px; height:26px; border-radius:50%; background:var(--topic-light); color:var(--topic-color);
    display:flex; align-items:center; justify-content:center; font-size:.82rem; font-weight:800; flex-shrink:0;
  }
  .q-opt:hover:not(.locked){ transform:translateY(-2px); }
  .q-opt.correct{ background:#DCF5DE; border-color:var(--green-ok); animation:popIn .35s ease; }
  .q-opt.correct .opt-letter{ background:var(--green-ok); color:#fff; }
  .q-opt.wrong{ background:#FBE1DE; border-color:var(--red-bad); animation:shake .4s ease; }
  .q-opt.wrong .opt-letter{ background:var(--red-bad); color:#fff; }
  .q-opt.locked{ cursor:default; }
  @keyframes popIn{ 0%{transform:scale(.9);} 60%{transform:scale(1.04);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .q-feedback{
    margin-top:1rem; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
    min-height:1.5em; text-align:center;
  }
  .q-feedback.ok{ color:var(--green-ok); }
  .q-feedback.bad{ color:var(--red-bad); }

  #nextBtnWrap{ text-align:center; margin-top:.9rem; min-height:2.6rem; }
  .nextBtn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
    background:var(--topic-color); color:#fff; border:none; border-radius:999px;
    padding:.6rem 1.8rem; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.2);
  }

  /* ---------- RESULTS SCREEN ---------- */
  #resultsScreen{ padding:1.6rem 1.8rem 1.8rem; overflow-y:auto; align-items:center; text-align:center; }
  .score-badge{
    width:150px; height:150px; border-radius:50%; margin:.6rem auto 1rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle,var(--topic-light),var(--topic-color));
    color:#fff; box-shadow:0 8px 0 rgba(0,0,0,.15);
  }
  .score-badge .sb-num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:2.2rem; line-height:1; }
  .score-badge .sb-total{ font-size:.85rem; font-weight:700; }
  #resultMsg{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.4rem; margin:.2rem 0 .3rem; color:var(--topic-color); }
  #resultSub{ color:var(--ink-soft,#4B5F45); margin-bottom:1.2rem; }
  .result-actions{ display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center; margin-bottom:1.3rem; }
  .actionBtn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.95rem;
    border:none; border-radius:999px; padding:.65rem 1.5rem; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  .actionBtn.primary{ background:var(--topic-color); color:#fff; }
  .actionBtn.secondary{ background:var(--paper); color:var(--ink); }

  #reviewList{ width:100%; text-align:left; max-width:640px; margin:0 auto; }
  #reviewList h3{ font-family:'Baloo 2',sans-serif; text-align:center; color:var(--ink); margin-bottom:.6rem;}
  .review-item{
    background:var(--paper); border-radius:12px; padding:.8rem 1rem; margin-bottom:.6rem;
    border-left:5px solid var(--red-bad);
  }
  .review-item .ri-q{ font-weight:700; font-size:.92rem; margin-bottom:.3rem; }
  .review-item .ri-a{ font-size:.86rem; color:var(--green-ok); font-weight:700; }
  .review-item .ri-your{ font-size:.86rem; color:var(--red-bad); }

  @media (max-width:600px){
    .q-opts{ grid-template-columns:1fr; }
    #app{ border-radius:16px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="appHeader">
    <h1 class="display">🌍 Green Olympiad Quiz Challenge</h1>
    <p id="headerSub">Pick a topic and test what you know!</p>
  </div>

  <div id="homeScreen" class="screen active">
    <div class="topic-grid" id="topicGrid"></div>
  </div>

  <div id="quizScreen" class="screen">
    <div class="quiz-topbar">
      <button id="backHomeBtn">⬅ Topics</button>
      <div id="quizProgressLabel"></div>
      <div id="quizScoreLabel"></div>
    </div>
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div class="q-card">
      <div class="q-text" id="qText"></div>
      <div class="q-opts" id="qOpts"></div>
      <div class="q-feedback" id="qFeedback"></div>
      <div id="nextBtnWrap"></div>
    </div>
  </div>

  <div id="resultsScreen" class="screen">
    <div class="score-badge">
      <div class="sb-num" id="scoreNum">0</div>
      <div class="sb-total" id="scoreTotal">out of 0</div>
    </div>
    <div id="resultMsg"></div>
    <div id="resultSub"></div>
    <div class="result-actions">
      <button class="actionBtn primary" id="retryBtn">↺ Try Again</button>
      <button class="actionBtn secondary" id="homeBtn">🏠 Choose Another Topic</button>
    </div>
    <div id="reviewList"></div>
  </div>
</div>

  const byTopic = {};

  // ---------------- STATE ----------------
  let session = null; // { topicKey, color, light, questions:[], idx, score, wrongList:[] }
  const best = {}; // topicKey -> best score string, session-only memory

  const appHeader = document.getElementById('appHeader');
  const headerSub = document.getElementById('headerSub');
  const homeScreen = document.getElementById('homeScreen');
  const quizScreen = document.getElementById('quizScreen');
  const resultsScreen = document.getElementById('resultsScreen');
  const topicGrid = document.getElementById('topicGrid');

  function showScreen(el){
    [homeScreen, quizScreen, resultsScreen].forEach(s=>s.classList.remove('active'));
    el.classList.add('active');
  }

  function setTheme(color, light){
    document.documentElement.style.setProperty('--topic-color', color);
    document.documentElement.style.setProperty('--topic-light', light);
    appHeader.style.background = `linear-gradient(135deg, ${color}, ${shade(color,-18)})`;
  }
  function shade(hex, percent){
    const num = parseInt(hex.replace('#',''),16);
    let r = (num>>16) + percent, g = ((num>>8)&0x00FF) + percent, b = (num&0x0000FF) + percent;
    r = Math.min(255,Math.max(0,r)); g = Math.min(255,Math.max(0,g)); b = Math.min(255,Math.max(0,b));
    return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function renderHome(){
    setTheme('#2E7D32', '#C8E6C9');
    headerSub.textContent = 'Pick a topic and test what you know!';
    topicGrid.innerHTML = '';

    const mixed = document.createElement('div');
    mixed.className = 'topic-card mixed-card';
    mixed.innerHTML = `
      <div class="tc-top"><span class="tc-emoji">🏆</span><span class="tc-name display">Mixed Challenge — All Topics</span></div>
      <div class="tc-count">${QUIZ_DATA.length} questions, shuffled</div>
      <div class="tc-best">${best['__mixed__'] ? 'Best: '+best['__mixed__'] : ''}</div>`;
    mixed.addEventListener('click', ()=> startQuiz('__mixed__'));
    topicGrid.appendChild(mixed);

    TOPIC_META.forEach(t=>{
      const qs = byTopic[t.key] || [];
      const card = document.createElement('div');
      card.className = 'topic-card';
      card.style.setProperty('--card-color', t.color);
      card.innerHTML = `
        <div class="tc-top"><span class="tc-emoji">${t.emoji}</span><span class="tc-name display">${t.key}</span></div>
        <div class="tc-count">${qs.length} questions</div>
        <div class="tc-best">${best[t.key] ? 'Best: '+best[t.key] : ''}</div>`;
      card.addEventListener('click', ()=> startQuiz(t.key));
      topicGrid.appendChild(card);
    });
  }

  function startQuiz(topicKey){
    let meta, questions;
    if(topicKey === '__mixed__'){
      meta = { key:'__mixed__', color:'#E1665B', light:'#FFD9D4' };
      questions = shuffle(QUIZ_DATA);
    } else {
      meta = TOPIC_META.find(t=>t.key===topicKey);
      questions = shuffle(byTopic[topicKey]);
    }
    session = { meta, questions, idx:0, score:0, wrongList:[] };
    setTheme(meta.color, meta.light);
    headerSub.textContent = topicKey === '__mixed__' ? 'Mixed Challenge' : topicKey;
    showScreen(quizScreen);
    renderQuestion();
  }

  function renderQuestion(){
    const { meta, questions, idx } = session;
    const q = questions[idx];
    document.getElementById('quizProgressLabel').textContent = `Question ${idx+1} of ${questions.length}`;
    document.getElementById('quizScoreLabel').textContent = `Score: ${session.score}`;
    document.getElementById('progressFill').style.width = (idx/questions.length*100)+'%';
    document.getElementById('qText').textContent = q.q;
    document.getElementById('qFeedback').textContent = '';
    document.getElementById('qFeedback').className = 'q-feedback';
    document.getElementById('nextBtnWrap').innerHTML = '';

    const optsWrap = document.getElementById('qOpts');
    optsWrap.innerHTML = '';
    const letters = ['A','B','C','D'];
    q.opts.forEach((opt, i)=>{
      const btn = document.createElement('button');
      btn.className = 'q-opt';
      btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
      btn.addEventListener('click', ()=> answerQuestion(i, btn));
      optsWrap.appendChild(btn);
    });
  }

  function answerQuestion(i, btn){
    const { questions, idx } = session;
    const q = questions[idx];
    const allOpts = Array.from(document.querySelectorAll('.q-opt'));
    allOpts.forEach(b=>b.classList.add('locked'));

    const feedback = document.getElementById('qFeedback');
    if(i === q.correct){
      btn.classList.add('correct');
      feedback.textContent = '✓ Correct! Great job!';
      feedback.className = 'q-feedback ok';
      session.score++;
    } else {
      btn.classList.add('wrong');
      allOpts[q.correct].classList.add('correct');
      feedback.textContent = '✗ Not quite — the correct answer is highlighted.';
      feedback.className = 'q-feedback bad';
      session.wrongList.push({ q: q.q, correct: q.opts[q.correct], yours: q.opts[i] });
    }
    document.getElementById('quizScoreLabel').textContent = `Score: ${session.score}`;

    const wrap = document.getElementById('nextBtnWrap');
    const btnEl = document.createElement('button');
    btnEl.className = 'nextBtn display';
    btnEl.textContent = (idx === questions.length-1) ? 'See Results →' : 'Next Question →';
    btnEl.addEventListener('click', advanceQuestion);
    wrap.appendChild(btnEl);
  }

  function advanceQuestion(){
    session.idx++;
    if(session.idx >= session.questions.length){
      finishQuiz();
    } else {
      renderQuestion();
    }
  }

  function finishQuiz(){
    const { meta, questions, score, wrongList } = session;
    const total = questions.length;
    const pct = Math.round((score/total)*100);
    const label = meta.key === '__mixed__' ? '__mixed__' : meta.key;
    const scoreStr = `${score}/${total}`;
    if(!best[label] || score > parseInt(best[label])) best[label] = scoreStr;

    setTheme(meta.color, meta.light);
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('scoreTotal').textContent = 'out of ' + total;

    let msg, sub;
    if(pct === 100){ msg = '🏆 Perfect Score!'; sub = "You're a true Green Olympiad champion!"; }
    else if(pct >= 80){ msg = '🌟 Excellent Work!'; sub = "You really know your stuff — almost perfect!"; }
    else if(pct >= 60){ msg = '👍 Good Job!'; sub = "Solid effort! A little more practice and you'll be an expert."; }
    else { msg = '🌱 Keep Practicing!'; sub = "Review the answers below, then try again — you'll improve fast!"; }
    document.getElementById('resultMsg').textContent = msg;
    document.getElementById('resultSub').textContent = sub;

    const reviewWrap = document.getElementById('reviewList');
    if(wrongList.length === 0){
      reviewWrap.innerHTML = '';
    } else {
      reviewWrap.innerHTML = '<h3 class="display">Questions to Review</h3>' +
        wrongList.map(w => `
          <div class="review-item">
            <div class="ri-q">${w.q}</div>
            <div class="ri-your">Your answer: ${w.yours}</div>
            <div class="ri-a">Correct answer: ${w.correct}</div>
          </div>`).join('');
    }
    showScreen(resultsScreen);
  }

  document.getElementById('backHomeBtn').addEventListener('click', ()=>{
    session = null;
    showScreen(homeScreen);
    renderHome();
  });
  document.getElementById('homeBtn').addEventListener('click', ()=>{
    session = null;
    showScreen(homeScreen);
    renderHome();
  });
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    const key = session.meta.key;
    startQuiz(key);
  });

  renderHome();
})();
</script>
</body>
</html>
